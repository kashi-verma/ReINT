[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reint-wind-decision-api"
version = "0.1.0"
description = "Point-in-time wind forecast decision API for the REint challenge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pandas>=2.2,<4.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

